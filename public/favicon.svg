<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PassOn favicon">
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7FFF7"/>
      <stop offset="100%" stop-color="#B9F4DF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43C997"/>
      <stop offset="100%" stop-color="#1FB976"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006A78"/>
      <stop offset="100%" stop-color="#004B5A"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD2D8"/>
      <stop offset="100%" stop-color="#AEB8C1"/>
    </linearGradient>
  </defs>

  <!-- back cards -->
  <rect x="22" y="30" width="154" height="176" rx="26"
        transform="rotate(-13 99 118)" fill="url(#mint)"/>
  <rect x="34" y="42" width="164" height="174" rx="28"
        transform="rotate(-7 116 129)" fill="url(#green)"/>

  <!-- front card -->
  <rect x="54" y="58" width="154" height="164" rx="28" fill="#FFFFFF"/>

  <!-- list bullets -->
  <circle cx="88" cy="101" r="15" fill="url(#teal)"/>
  <circle cx="88" cy="141" r="15" fill="#B9C2CA"/>
  <circle cx="88" cy="181" r="17" fill="#0EBB63"/>

  <!-- check -->
  <path d="M79 181.5l6.5 6.5 12.5-14" fill="none" stroke="#fff"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- list lines -->
  <rect x="111" y="92" width="63" height="15" rx="7.5" fill="url(#gray)"/>
  <rect x="111" y="132" width="54" height="15" rx="7.5" fill="url(#gray)"/>
  <rect x="111" y="172" width="70" height="15" rx="7.5" fill="url(#gray)"/>

  <!-- arrow -->
  <path d="M179 107h18V91c0-5.8 7-8.7 11.1-4.6l35.5 35.5a6.5 6.5 0 010 9.2l-35.5 35.5c-4.1 4.1-11.1 1.2-11.1-4.6v-16h-18c-8.8 0-16-7.2-16-16v-7c0-8.8 7.2-16 16-16z"
        fill="url(#teal)"/>
</svg>
